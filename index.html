
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chest Day?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #111318;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 28px 22px;
            background: #1b1d24;
            border: 1px solid #30323c;
            border-radius: 24px;
            text-align: center;
        }

        h1 {
            color: #fb4b4b;
            font-size: 30px;
            letter-spacing: 2px;
        }

        p {
            color: #b9bbc5;
            line-height: 1.5;
        }

        input, button {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 14px;
            border-radius: 12px;
            font-size: 17px;
        }

        input {
            background: #111318;
            border: 1px solid #454753;
            color: white;
        }

        button {
            border: none;
            background: #b91c1c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #343640;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            border-radius: 14px;
            background: #30202a;
            color: white;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .subtitle {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>CHEST DAY? 💪</h1>

        <p>Did you hit chest today?</p>
        <p class="subtitle">Be honest. No excuses.</p>

        <form method="POST">
            <input
                type="number"
                name="pr"
                min="0"
                step="any"
                placeholder="Bench PR in kg (e.g. 100)"
            >

            <button type="submit" name="answer" value="yes">
                YES 🔥
            </button>

            <button type="submit" name="answer" value="no"
                    class="secondary" formnovalidate>
                NO 💀
            </button>

            <button type="submit" name="answer" value="idk"
                    class="secondary" formnovalidate>
                I DON'T KNOW 🤔
            </button>
        </form>

        {% if message %}
            <div class="result">
                {{ message }}
            </div>
        {% endif %}
    </main>
</body>
</html>
